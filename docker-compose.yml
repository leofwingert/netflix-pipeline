x-airflow-common: &airflow-common
  build: .
  image: netflix-airflow:2.8.2
  user: "${AIRFLOW_UID:-1000}:0"
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__WEBSERVER__WORKERS=1
    - AIRFLOW__SCHEDULER__PARSING_PROCESSES=1
    - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_WEBSERVER_SECRET_KEY:-netflix-pipeline-local-secret}
    - GOOGLE_APPLICATION_CREDENTIALS=/opt/airflow/config/${GCP_CREDENTIALS_FILE:-google_credentials.json}
    - GCP_PROJECT_ID=${GCP_PROJECT_ID}
    - GCP_DATASET_GOLD=${GCP_DATASET_GOLD:-netflix_analitical}
    - GCP_BUCKET_NAME=${GCP_BUCKET_NAME}
    - 'AIRFLOW_CONN_GOOGLE_CLOUD_DEFAULT={"conn_type": "google_cloud_platform", "extra": {"key_path": "/opt/airflow/config/${GCP_CREDENTIALS_FILE:-google_credentials.json}", "project": "${GCP_PROJECT_ID}"}}'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./config:/opt/airflow/config
    - airflow-logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-airflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-airflow}
      - POSTGRES_DB=${POSTGRES_DB:-airflow}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-webserver:
    <<: *airflow-common
    ports:
      - "8080:8080"
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --firstname Admin --lastname User --role Admin --email ${AIRFLOW_ADMIN_EMAIL:-admin@example.com} --password ${AIRFLOW_ADMIN_PASSWORD:-admin} &&
               airflow webserver"

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: netflix-dashboard
    ports:
      - "8501:8501"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/config/${GCP_CREDENTIALS_FILE:-google_credentials.json}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_DATASET_GOLD=${GCP_DATASET_GOLD:-netflix_analitical}
      - GCP_BUCKET_NAME=${GCP_BUCKET_NAME}
    volumes:
      - ./app.py:/app/app.py
      - ./config:/app/config:ro
    restart: unless-stopped

volumes:
  postgres-db-volume:
  airflow-logs:
