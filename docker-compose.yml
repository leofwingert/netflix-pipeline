x-airflow-common: &airflow-common
  build: .
  image: netflix-airflow:2.8.2
  user: "${AIRFLOW_UID:-1000}:0"
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__WEBSERVER__WORKERS=1
    - AIRFLOW__SCHEDULER__PARSING_PROCESSES=1
    # Mesma secret_key no webserver e no scheduler (corrige o 403 ao ler logs na UI)
    - AIRFLOW__WEBSERVER__SECRET_KEY=netflix-pipeline-local-secret
    - GOOGLE_APPLICATION_CREDENTIALS=/opt/airflow/config/iconic-era-510313-m5-e68d937f2679.json
  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./config:/opt/airflow/config
    - ./logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-webserver:
    <<: *airflow-common
    ports:
      - "8080:8080"
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin &&
               airflow webserver"

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler

volumes:
  postgres-db-volume: